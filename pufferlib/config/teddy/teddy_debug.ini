# Single car, single map: the overfitting rig for puffer_teddy.
#
# Same simulator, same reward, same policy as `puffer train puffer_teddy` -- the only
# differences are scale and variety. One agent is placed on map_000 and nothing else
# moves, so a failure here is a failure of the reward or the dynamics, not of
# generalization: a policy that cannot solve one fixed scene will not solve ten
# thousand, and unlike the full run this one answers in minutes.
#
#   puffer train puffer_teddy_debug
#   .venv/bin/python -m pufferlib.teddy.drive.trace_agent --policy <ckpt> --plot t.png
#
# The trace_agent script reads the same env through the per-step reward trace, which
# is what turns "score is not going up" into "which of the four terms is paying".

[base]
package = teddy
env_name = puffer_teddy_debug
policy_name = TeddyDrive
; Set to None to disable recurrence. In case this the policy will only see
; the current observation (o_t). Set to "Recurrent" to provide the policy with
; memory through an LSTM.
rnn_name = Recurrent

[vec]
; 32 Drive instances over 8 worker processes, one car each. They differ only in their
; seed (vector.py hands env i `seed + i`), so all 32 drive map_000 from 32 spawn
; poses -- the variety is in where the car starts, not in the scene. 32 rather than 8
; purely for throughput: one agent per forward pass ran at 2.3K SPS, 32 runs at 10K.
; Drop to num_workers = 1, num_envs = 1, backend = Serial for a single reproducible
; trajectory (and set train.batch_size = 128 to match).
num_workers = 8
num_envs = 32
batch_size = 16
;backend = Serial

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
; One car per scene. With agents_per_map_min = agents_per_map_max = 1 and
; num_maps = 1 below, this is literally one agent on map_000 and no traffic.
num_agents = 1
; What the env writes into the observation buffer.
;   vector       - privileged entity sets (ego + partners + road). The baseline.
;   render_state - ego vector only; the scene goes out through the separate
;                  RenderState buffers for the perspective rasterizer, so the
;                  policy sees pixels instead of privileged scene values.
; Options: vector, render_state
obs_mode = vector
; Bitmask over entity types drawn into the perspective view. 0 uses the built-in
; default (ROAD_LINE | ROAD_EDGE | CROSSWALK | SPEED_BUMP). Lane centerlines are
; excluded on purpose: they have no painted counterpart on real asphalt.
render_road_types = 0
; Options: discrete, continuous
action_type = discrete
; Options: classic, jerk
; jerk, matching puffer_teddy_cam and puffer_teddy_3cam: 4 longitudinal x 3 lateral
; bins. classic is the 7x13 = 91-action joint space, which is a different problem
; (and a different ego observation width), so the two are not checkpoint
; compatible and their entropies are not comparable -- log(91) = 4.51 against
; log(12) = 2.48.
dynamics_model = jerk
; --- Reward knobs, all live in teddy ------------------------------------------
; This is the whole reward function. giga leaves these inert and weights its nine
; terms per agent from a randomized conditioning vector; teddy reads these five
; values straight out of this file, the same ones for every agent, which is the
; entire difference between the two envs.
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
; Paid on every intermediate waypoint, and on the final goal the first time an agent
; reaches one. Every goal after the agent's first respawn pays the post_respawn rate
; instead, so a policy cannot farm one easy goal over and over.
reward_goal = 1.0
reward_goal_post_respawn = 0.25
; giga randomized these per agent over U(2, 12) m and U(0, 20) m/s
; (cond[COND_DELTA_GOAL] / cond[COND_V_GOAL]). Fixed here at the middle of each
; range, since there is nothing left to randomize them with. goal_speed gates the
; final goal only -- intermediate waypoints are drive-through.
goal_radius = 5.0
goal_speed = 20.0
dt = 0.1
; What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop"
goal_behavior = 0
; Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
; Large numbers will select a goal point further away from the agent's current position.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 0
; Number of steps before
; Short episodes on purpose: at one agent the whole point is to see many episode
; boundaries per minute, and 256 steps is 25.6 s of driving, long enough to reach a
; goal 20-80 m away.
episode_length = 256
; 0 disables resampling. There is only one map, but resample_frequency also rebuilds
; the C envs, which would throw away the scene mid-run for no benefit here.
resample_frequency = 0
termination_mode = 0 # 0 - terminate at episode_length, 1 - terminate after all agents have been reset
map_dir = "resources/drive/binaries/training"
; map_000.bin, and only that one.
num_maps = 1
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; --- Agent selection, inert in teddy ------------------------------------------
; Kept because binding.c unpacks them, but teddy_set_active_agents makes every
; synthesised entity active regardless: the dataset-driven selector that reads
; these (set_active_agents / should_control_agent in drive.h) has no caller here.
; In particular "control_vehicles" does NOT restrict teddy to type == VEHICLE the
; way it does in ocean -- pedestrians and cyclists are controlled either way.
control_mode = "control_agents"
init_mode = "create_all_valid"
max_controlled_agents = 32
; How far another car can be and still enter the vector observation, in metres.
; The partner slots are ranked by distance, so this is a clean "how much of the
; scene may the policy see" knob: shrink it and the nearest cars are the ones that
; stay. <= 0 falls back to the built-in 50 m, which is what was hardcoded before.
; puffer_drive and puffer_teddy must agree on this for a checkpoint to mean the same
; thing in both.
partner_obs_radius = 50.0
; Render mode options:
; 0:"window" = pop-up raylib window (original)
; 1:"headless" = off-screen; frames piped to ffmpeg (recommended for training)

; --- Gigaflow random initialization -----------------------------------------
; Agents per scene. Gigaflow uses U{1,150}; 120 is the local cap that WOMD crops
; can still place without stacking (measured: 83% of maps fit 128 agents at 6 m
; spacing). Mean is 60.5, so a 2048-agent budget spreads over ~34 maps.
; Pinned to 1/1: this is what makes the scene single-car rather than a crowd whose
; size happens to be drawn small.
agents_per_map_min = 1
agents_per_map_max = 1
; Initial speed is U(0, spawn_speed_max) along the lane. Note WOMD's own vehicles
; have a median speed of 0 m/s -- half the logged "agents" are parked -- which is
; exactly what random spawning replaces.
spawn_speed_max = 12.0
; Gigaflow randomizes heading freely; we keep agents lane-aligned with a small
; jitter because the camera policy is meant to transfer to real Waymo imagery.
; Raise wrong_way_frac to reintroduce oncoming traffic deliberately.
spawn_heading_jitter_deg = 3.0
wrong_way_frac = 0.0
; Route: N_wp ~ U{0,3} intermediate waypoints plus the final goal. The paper spaces
; them 20-200 m apart on 4-40 km CARLA towns; a WOMD crop is ~274 m across and a
; random walk covers ~168 m, so the upper bound is 80 m here.
num_waypoints_max = 3
waypoint_min_dist = 20.0
waypoint_max_dist = 80.0
; Empirical (length, width, height) triples + class frequencies measured from the
; WOMD corpus. Build with: python data_utils/womd/build_agent_dist.py
agent_dist_path = "resources/drive/agent_dist.bin"
render_mode = 1

[train]
; The PPO block mirrors puffer_teddy_cam so the vector run is a usable baseline for
; the camera runs: same optimizer, horizon, discount and loss weights, differing
; only where the observation makes them differ. The previous settings here
; (muon / rollout 32 / gamma 0.98 / lr 3e-3) were tuned for the 91-step ocean
; episode and never followed the env to a 1280-step one.
seed=42
; ~30 minutes at the 10K SPS this configuration measures. Far more than an overfit on
; one scene should need; stop it by hand once the curve flattens.
total_timesteps = 20_000_000
optimizer = adamw
weight_decay = 0.01
anneal_lr = True
anneal_entropy = False
; num_agents * vec.num_envs * rollout_horizon = 1 * 32 * 128. Two orders of magnitude
; below the full run, which is the price of a single-agent scene: the gradient is
; noisier, so read the curve over epochs rather than step to step.
batch_size = 4096
minibatch_size = 1024
max_minibatch_size = 1024
rollout_horizon = 128
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.01
gae_lambda = 0.95
; 0.98 over a 1280-step episode is a ~50-step horizon, i.e. 5 seconds at dt = 0.1:
; shorter than the gap between two waypoints, so the value function could not see
; a goal it was being asked to drive to.
gamma = 0.999
learning_rate = 5.0e-4
max_grad_norm = 0.5
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 0.5
vtrace_c_clip = 1
vtrace_rho_clip = 1
; Frequent, because the run is short and the point is to compare early against late
; with trace_agent.
checkpoint_interval = 50

[eval]
; Eval frequency in epochs. Effectively off: the eval path loads its own scenes and
; would defeat the purpose of pinning the run to one map.
eval_interval = 1000000000
; Path to dataset used for evaluation
map_dir = "resources/drive/binaries/training"
; Number of agents to evaluate
num_eval_agents = 64
; If True, enable self-play evaluation (pair policy-controlled agent with a copy of itself)
self_play_eval = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = False
; Which env to render during eval. Options: "first" (by index), "worst_collision", "random"
render_select_mode = "first"
; If True, render random scenarios. Note: Doing this frequency will slow down the training.
render_human_replay_eval = False
render_self_play_eval = True
; Number of scenarios to process per batch
wosac_batch_size = 32
; Target number of unique scenarios perform evaluation in
wosac_target_scenarios = 64
; Total pool of scenarios to sample from
wosac_scenario_pool_size = 1000
; Max batches, used as a timeout to prevent an infinite loop
wosac_max_batches = 100
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
; Number of policy rollouts per scene
wosac_num_rollouts = 32
; When to start the simulation
wosac_init_steps = 10
; Control everything valid at init in the scene
wosac_control_mode = "control_wosac"
; Create everything in valid at init the scene
wosac_init_mode = "create_all_valid"
; Stop when reaching the goal
wosac_goal_behavior = 2
; Can shrink goal radius for WOSAC evaluation
wosac_goal_radius = 2.0
wosac_sanity_check = False
; Only return aggregate results across all scenes
wosac_aggregate_results = True
; Evaluation mode: "policy", "ground_truth"
wosac_eval_mode = "policy"

; Ranges are centred on the [train] values above. They were left centred on the
; muon settings (lr 3e-3, gamma 0.98) after the env moved to a 1280-step episode,
; so every sample was drawn from a horizon too short for the task.
[sweep.train.learning_rate]
distribution = log_normal
min = 1.0e-4
mean = 5.0e-4
max = 2.0e-3
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.003
mean = 0.01
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.995
mean = 0.999
max = 0.9995
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

; goal_speed is live in teddy (it gates the final goal), so it is a real sweep
; dimension again -- but it is left out here to keep the reward fixed while the PPO
; hyperparameters are swept.

[controlled_exp.train.ent_coef]
values = [0.005, 0.01, 0.02]

[controlled_exp.train.seed]
values = [42, 55, 1]
