# Alberti on Gigaflow init: two-camera front+back rig, aimed at Bench2Drive.
#
# Same simulator, same observation pipeline and same policy as puffer_giga_3cam:
# the env emits a world-frame RenderState, PerspectiveVecEnv rasterizes it into
# camera images on the GPU, and the policy sees only those pixels plus the ego
# state a real vehicle can measure about itself. The rig is the only difference --
# Waymo's front camera plus a rear-facing camera with the same intrinsics, instead
# of Waymo's three forward ones. Everything else is copied from giga_3cam.ini so
# that a comparison between the two measures the rig and nothing else.
#
# Why front+back rather than a surround rig. Bench2Drive's published baselines
# (UniAD, VAD) drive six nuScenes-style cameras, but the benchmark does not
# require six: on the SENSORS track the agent declares its own rig, capped at
# eight RGB cameras (leaderboard/autoagents/agent_wrapper.py SENSORS_LIMITS), so
# any count from one up is a legal entry scored the same way. Two is what fits the
# local card. The conv stack sees batch * num_cameras frames, so activation memory
# and step time are both linear in the rig size (figures in [train] below).
#
# What two cameras costs, stated plainly. A 49.8 degree front camera and a 49.8
# degree rear one cover [-24.9, +24.9] and [155.1, 204.9] degrees: 99.7 of 360,
# leaving two 130.2 degree blind wedges centred on +-90. Cross traffic at an
# intersection stays invisible until it is nearly ahead, which is exactly the case
# puffer_giga_3cam's continuous +-69.5 degree arc exists to cover. So expect this
# rig to lose its ground on turning and merging routes rather than on
# car-following, and read the per-scenario Bench2Drive breakdown, not just the
# aggregate driving score. If that is where the loss lands, the cheap fix is field
# of view rather than camera count -- see the hfov_deg note on the rig below.
#
# The giga family, all sharing the Gigaflow-style random initialization:
#   puffer train puffer_giga          (privileged vector observations)
#   puffer train puffer_giga_cam      (single front camera)
#   puffer train puffer_giga_3cam     (Waymo's three front-facing cameras)
#   puffer train puffer_giga_b2d_2cam (this, front + back)
#
# Not yet wired to the CARLA side: data_utils/sim2real/carla/rig.py pins the
# deployed rig to raster_ref.WAYMO_RIG, and b2d/export.py asserts three cameras in
# CAMERA_ORDER, so a checkpoint trained here cannot be bundled for the leaderboard
# until both learn the rig from this config.

[base]
package = giga
env_name = puffer_giga_b2d_2cam
policy_name = GigaDriveCam
; Deviates from the paper: LSTM after the backbone, before actor/value.
rnn_name = Recurrent

[vec]
; PerspectiveVecEnv reads the RenderState buffers in process, so the envs must
; live here rather than in worker processes. The shared-memory path for the
; Multiprocessing backend is not built yet.
backend = Serial
num_workers = 1
num_envs = 1
batch_size = 1

[policy]
input_size = 128
hidden_size = 512
cnn_channels = 128
scene_dim = 256
ego_dim = 64
backbone_layers = 4
; GroupNorm groups inside the conv stack (0 = no normalization, the paper's Tab. 4
; stack verbatim). Not in the paper, but without it the conv output scale is
; unbounded -- the LayerNorm in cam_proj hides the growth from the loss while its
; 1/sigma backward weakens the only gradient that could correct it. That killed two
; runs; see Agents.md session 2.
cnn_norm_groups = 8

[rnn]
; Must match [policy] hidden_size: this sits between the backbone output and
; the actor/value heads, both sized to hidden_size.
input_size = 512
hidden_size = 512

[env]
num_agents = 2048
obs_mode = render_state
render_road_types = 0
; Approximate drivable surface by widening each ROAD_LANE centerline. Width is
; the full strip width in metres, not the distance on either side.
draw_lane_area = True
lane_width = 4.5
; Camera rig. Either a preset name or a JSON list of camera dicts, so the rig
; extends without a kernel change. Positions are ego frame (x forward, y left,
; z up from the road) in metres, with the origin at the ego's bounding box
; centre, and yaw is about z.
;
; Written out as JSON rather than named as a preset because no preset can supply
; this rig. WAYMO_RIG has no rear camera -- WOD never recorded one, so there is no
; calibration to copy -- and NUPLAN_RIG's back camera renders at 96x54, which a
; rig sharing one resolution cannot mix with the 96x64 Waymo front.
;
; "front" is WAYMO_RIG's front camera verbatim (the same literal giga_cam.ini
; uses): 2066.7 px focal length on a 1920x1280 sensor rendered at 96x64, i.e. a
; 49.8 x 34.4 degree FOV, mounted on the roof at 2.1157 m.
;
; "back" is that camera mirrored through the box centre: identical intrinsics and
; height, x negated, yaw 180. Any rear mount is invented here, and the mirror is
; the smallest invention -- the rear view is then the front view's geometry
; rotated, which is one difference fewer between the two inputs to a conv stack
; whose weights they share. Mount x hardly matters in any case: the rasterizer
; skips the ego's own box -- the `self_index` column of `egos`, honoured by both
; raster_ref.render and the drive_raster op -- so nothing occludes the view from
; either end of the roof, and 0.2 m of parallax is below the geometry this
; renderer resolves.
;
; Nothing sits between the two arcs. To buy coverage without buying a third
; camera, set "hfov_deg" on both entries; it overrides focal_px in
; Camera.intrinsics(). hfov_deg = 120 shrinks the blind wedges from 130.2 to 60
; degrees each, but fy follows fx, so at 96x64 the vertical FOV opens to 98.2
; degrees and most of the frame becomes sky and asphalt. A wider, shorter frame
; (128x48 gives 81.8 degrees vertical) is the companion change, and it moves
; self.cnn_out in GigaDriveCam, so re-measure step time and memory before
; training on it.
;
; Front + back (here):                       the JSON below
; Waymo's three front-facing cameras:        cameras = waymo
; Waymo's front camera alone:                cameras = front
; Pictura's four nuPlan cameras:             cameras = nuplan
;
; Note the viewer's panel puts "back" at the left end of the strip:
; perspective.display_order sorts by descending mounting yaw, and 180 sorts first.
; Only the blit order is affected -- the policy sees the rig in config order --
; and each view is captioned with its camera name.
cameras = [{"name": "front", "pos": [0.104, -0.0237, 2.1157], "yaw_deg": 0.0, "width": 96, "height": 64}, {"name": "back", "pos": [-0.104, -0.0237, 2.1157], "yaw_deg": 180.0, "width": 96, "height": 64}]
; The paper drives with jerk actions: 4 longitudinal x 3 lateral bins.
action_type = discrete
dynamics_model = jerk
; --- Reward knobs, mostly inert in giga --------------------------------------
; binding.c unpacks all five unconditionally so they cannot be deleted, but the
; giga reward path never reads them: the per-agent conditioning vector replaces
; them (conditioning.h). reward_goal is the only live one.
;   reward_vehicle_collision -> cond[COND_ALPHA_COLLISION]
;   reward_offroad_collision -> cond[COND_ALPHA_BOUNDARY]
;   reward_goal_post_respawn -> inert; a respawned goal pays plain reward_goal
;   goal_radius              -> cond[COND_DELTA_GOAL]  (still drives the renderer)
;   goal_speed               -> cond[COND_V_GOAL]
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
; Live: paid on every waypoint and on the final goal.
reward_goal = 1.0
dt = 0.1
goal_behavior = 0
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 1280
resample_frequency = 2560
termination_mode = 0
map_dir = "resources/drive/binaries/training_map_only"
num_maps = 10000
init_steps = 0
; --- Agent selection, inert in giga ------------------------------------------
; Kept because binding.c unpacks them, but giga_set_active_agents makes every
; synthesised entity active regardless: the dataset-driven selector that reads
; these (set_active_agents / should_control_agent in drive.h) has no caller here.
; In particular "control_vehicles" does NOT restrict giga to type == VEHICLE the
; way it does in ocean -- pedestrians and cyclists are controlled either way.
control_mode = "control_agents"
init_mode = "create_all_valid"
max_controlled_agents = 32

; --- Gigaflow random initialization -----------------------------------------
; Agents per scene. Gigaflow uses U{1,150}; 120 is the local cap that WOMD crops
; can still place without stacking (measured: 83% of maps fit 128 agents at 6 m
; spacing). Mean is 60.5, so a 2048-agent budget spreads over ~34 maps.
agents_per_map_min = 1
agents_per_map_max = 120
; Initial speed is U(0, spawn_speed_max) along the lane. Note WOMD's own vehicles
; have a median speed of 0 m/s -- half the logged "agents" are parked -- which is
; exactly what random spawning replaces.
spawn_speed_max = 12.0
; Gigaflow randomizes heading freely; we keep agents lane-aligned with a small
; jitter because the camera policy is meant to transfer to real Waymo imagery.
; Raise wrong_way_frac to reintroduce oncoming traffic deliberately.
spawn_heading_jitter_deg = 3.0
wrong_way_frac = 0.0
; Route: N_wp ~ U{0,3} intermediate waypoints plus the final goal. The paper spaces
; them 20-200 m apart on 4-40 km CARLA towns; a WOMD crop is ~274 m across and a
; random walk covers ~168 m, so the upper bound is 80 m here.
num_waypoints_max = 3
waypoint_min_dist = 20.0
waypoint_max_dist = 80.0
; Empirical (length, width, height) triples + class frequencies measured from the
; WOMD corpus. Build with: python data_utils/womd/build_agent_dist.py
agent_dist_path = "resources/drive/agent_dist.bin"

; 1 = headless. The C renderer spawns Xvfb when DISPLAY is unset; leaving this at
; 0 (windowed) segfaults on a headless box as soon as eval renders a rollout.
render_mode = 1

[train]
; Pictura Tab. 5, with rollout and minibatch scaled to a single 48 GB card.
; The paper uses 20,480 concurrent agents and a 2,621,440-step rollout on 32 H100s.
device = cuda
compile = False
optimizer = adamw
weight_decay = 0.01
; The observation buffer holds rendered pixels, so it must stay on the GPU.
cpu_offload = False
total_timesteps = 2_000_000_000
batch_size = 262144
rollout_horizon = 128
; minibatch_size is the logical minibatch; max_minibatch_size caps the chunk
; actually resident, and pufferl accumulates minibatch_size/max_minibatch_size of
; them into one optimizer step. Splitting here rather than shrinking
; minibatch_size keeps the gradient statistics identical to the single-camera
; runs, so the rig is the only thing that changed between them.
;
; The conv stack sees batch * num_cameras frames, so activation memory is linear
; in the rig size. Not re-measured for two cameras: the only local card was busy,
; and sharing it moves peak memory as well as time, because the conv workspace
; cuDNN picks depends on how much is free. The puffer_giga_3cam measurements
; settle the scaling anyway. At 96x64 with a 4096 chunk, one camera peaks at
; 4.89 GiB and the Waymo three at 14.60 GiB -- 2.99x, exactly the camera count --
; and time per sample scales 2.90x, so two cameras land near 9.8 GiB. The rollout
; observation buffer stays resident on the GPU (cpu_offload = False) and grows the
; same way: batch_size * obs_bytes is 2.26 GiB at one camera and 6.76 GiB at
; three, so ~4.5 GiB here. Call it ~14 GiB against the three-camera run's ~21.
; Single-camera figures measured earlier on an idle card, for reference: 8192
; peaks at 8.3 GiB and costs 16.9 us/sample, 32768 peaks at 32.9 GiB and
; 18.9 us/sample; the old 96x54 nuPlan frame gives 6.9/14.5 and 27.6/16.9.
; The paper's global 65536 is spread over 32 GPUs, so ~2048 per device.
;
; accumulate_minibatches = minibatch_size // max_minibatch_size (pufferl.py:153),
; so that accumulates nothing and steps the optimizer 64 times per epoch against
; puffer_giga_cam's 32, at half the effective batch.
minibatch_size = 8192
;a6000: 4096, h100: 8192
max_minibatch_size = 8192
update_epochs = 1
gamma = 0.999
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
learning_rate = 5.0e-4
anneal_lr = True
anneal_entropy = False
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
vf_clip_coef = 0.1999999999999999
; Gigaflow has no reward clipping; it filters advantages instead.
reward_clip = False
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 200
seed = 42
precision = float32

; Eval settings mirror puffer_drive so the two are compared the same way.
[eval]
; Eval frequency in epochs
eval_interval = 500
; Path to dataset used for evaluation
map_dir = "resources/drive/binaries/training_map_only"
; Number of agents to evaluate
num_eval_agents = 64
; If True, enable self-play evaluation (pair policy-controlled agent with a copy of itself)
self_play_eval = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = False
; Which env to render during eval. Options: "first" (by index), "worst_collision", "random"
render_select_mode = "first"
; If True, render random scenarios. Note: Doing this frequency will slow down the training.
render_human_replay_eval = False
render_self_play_eval = True
; Number of scenarios to process per batch
wosac_batch_size = 32
; Target number of unique scenarios perform evaluation in
wosac_target_scenarios = 64
; Total pool of scenarios to sample from
wosac_scenario_pool_size = 1000
; Max batches, used as a timeout to prevent an infinite loop
wosac_max_batches = 100
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
; Number of policy rollouts per scene
wosac_num_rollouts = 32
; When to start the simulation
wosac_init_steps = 10
; Control everything valid at init in the scene
wosac_control_mode = "control_wosac"
; Create everything in valid at init the scene
wosac_init_mode = "create_all_valid"
; Stop when reaching the goal
wosac_goal_behavior = 2
; Can shrink goal radius for WOSAC evaluation
wosac_goal_radius = 2.0
wosac_sanity_check = False
; Only return aggregate results across all scenes
wosac_aggregate_results = True
; Evaluation mode: "policy", "ground_truth"
wosac_eval_mode = "policy"
